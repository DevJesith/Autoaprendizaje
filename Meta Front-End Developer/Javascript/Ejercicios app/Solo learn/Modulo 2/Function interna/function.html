    <!-- Al usar código JS interno, es mejor práctica colocar el <script> en el final del cuerpo. Esto permite que el contenido HTML se cargue y se muestre primero, luego se ejecuta el script. -->

    <p id="p1">Paragraph text</p>

    <script>
        function changeColor() {
            let x = document.getElementById("p1");
            x.style.color = "green";
        }

        changeColor();
    </script>
